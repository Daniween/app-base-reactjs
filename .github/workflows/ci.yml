name: CI - Build & Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Start app (background)
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid

      - name: Install curl
        run: |
          apt-get update
          apt-get install -y curl

      - name: Wait for server to be ready
        run: |
          npx -y wait-on http://localhost:3000

      - name: Test with curl
        run: |
          run: curl -sSf http://localhost:3000

      - name: Show logs if failed
        if: failure()
        run: cat app.log

      - name: Stop app
        if: always()
        run: |
          kill $(cat app.pid) || true

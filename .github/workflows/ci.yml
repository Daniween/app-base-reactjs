name: GH Install Build Test
on:
  push:
    branches: [cdwfs]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Start Server
        run: npm start &

      - name: Wait for server to be ready
        run: npx --yes wait-on http://localhost:3000

      - name: Run Test
        run: curl -I http://localhost:3000 | grep "HTTP/1.1 200 OK"

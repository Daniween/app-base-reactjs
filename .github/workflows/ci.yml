name: GH Install Build Test
on:
  push:
    branches: [cdwfs]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Run Test
        run: curl http://localhost:3000
